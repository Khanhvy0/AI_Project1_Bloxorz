<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bloxorz Solver</title>
  <link rel="stylesheet" href="/static/style.css">
  <script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  } }
  </script>
</head>
<body>
  <main>
    <div id="stage">
      <h1 class="brand">BLOXORZ</h1>
      <div id="game-announcement" class="game-announcement" aria-live="assertive" hidden></div>
      <section id="solve-prompt" class="solve-prompt" role="dialog" aria-modal="true"
        aria-labelledby="solve-prompt-title" hidden>
        <h2 id="solve-prompt-title">Solved!</h2>
        <p>What would you like to do next?</p>
        <div class="solve-prompt-actions">
          <button id="btn-solve-next" class="solve-prompt-action">Continue</button>
          <button id="btn-solve-replay" class="solve-prompt-action">Replay this level</button>
        </div>
      </section>
    </div>
    <aside>
      <label for="level-select">Level</label>
      <select id="level-select"></select>
      <div class="board-zoom-controls" role="group" aria-label="Board size">
        <span>Board size</span>
        <button id="btn-board-smaller" type="button" aria-label="Zoom out">−</button>
        <button id="btn-board-larger" type="button" aria-label="Zoom in">+</button>
      </div>
      <div class="row">
        <button id="btn-new">New Game</button>
        <button id="btn-restart">Restart</button>
      </div>

      <h2>Solvers</h2>
      <button id="btn-solve-stop" hidden>Stop solver</button>
      <div class="solvers">
        <button data-algo="bfs">BFS</button>
        <button data-algo="dfs">DFS (IDS)</button>
        <button data-algo="ucs">UCS</button>
        <button data-algo="astar">A*</button>
      </div>

      <h2>Game</h2>
      <p id="hud-status">Playing</p>
      <p id="hud-moves">Moves: 0</p>
      <p id="msg"></p>

      <section id="metrics-panel" hidden>
        <h2>Search metrics</h2>
        <dl id="stats">
          <dt>Search time</dt><dd id="st-time">-</dd>
          <dt>Expanded nodes</dt><dd id="st-nodes">-</dd>
          <dt>Peak memory</dt><dd id="st-mem">-</dd>
          <dt>Solution length</dt><dd id="st-len">-</dd>
        </dl>
      </section>
      <p class="hint"><strong>Controls:</strong><br>Arrows / WASD: roll.<br>Space: switch cube.</p>
    </aside>
  </main>
  <script type="module" src="/static/main.js"></script>
</body>
</html>
